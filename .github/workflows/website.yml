name: Website

on:
  push:
    paths:
      - 'website/**'
      - 'play/generate-status.ps1'
      - 'play/_common.ps1'
      - 'play/isolate.ps1'
      - 'play/next.ps1'
      - 'play/turn.ps1'
      - '.github/workflows/website.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'play/generate-status.ps1'
      - 'play/_common.ps1'
      - 'play/isolate.ps1'
      - 'play/next.ps1'
      - 'play/turn.ps1'
      - '.github/workflows/website.yml'

defaults:
  run:
    working-directory: website

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Astro check
        run: npm run check

      - name: Vitest (schema + status producer via Node fallback)
        run: npm test

      - name: Build
        run: npm run build

  test-powershell-producer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: website

      - name: Vitest (status producer via PowerShell)
        run: npm test
        working-directory: website
